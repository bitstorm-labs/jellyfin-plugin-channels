name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # Core and its tests are net9.0; the plugin shell is net10.0
          # because Jellyfin.Controller 12.1.0 ships net10.0 only.
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Test the channel rules
        run: dotnet test tests/Jellyfin.Plugin.Channels.Core.Tests
      - name: Build the plugin
        run: dotnet build src/Jellyfin.Plugin.Channels -c Release -warnaserror
