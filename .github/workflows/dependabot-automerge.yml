name: Dependabot auto-merge

# Merges Dependabot's patch/minor PRs (including grouped ones) once CI passes.
# Major bumps are left for a human.
#
# This repo is private on GitHub Free, which offers neither branch
# protection (required checks) nor GitHub's auto-merge.
# So this job waits for the CI check ("build-and-test") itself and merges only the
# exact commit that passed (--match-head-commit). A failed check leaves the PR
# open for review.

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Merge as the bitstorm-bot app, not GITHUB_TOKEN: GitHub never starts
      # workflows from GITHUB_TOKEN's own pushes, so merges made with it skipped
      # the CI and release runs that should follow on main (OC-10). Dependabot
      # runs read Dependabot secrets only, so the app's ID and key live there.
      - name: bitstorm-bot token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI, then merge patch/minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK: build-and-test
        run: |
          set -euo pipefail
          # Poll up to ~50 minutes; the newest run of the check decides.
          for _ in $(seq 1 100); do
            state=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=$CHECK" --jq '
              [.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last
              | if . == null then "missing"
                elif .status != "completed" then "pending"
                else .conclusion end')
            echo "$CHECK: $state"
            case "$state" in
              success)
                # Dependabot closes a PR when a newer one supersedes it, which can
                # happen while we wait for CI. Nothing to merge then.
                if ! gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"; then
                  pr_state=$(gh pr view "$PR_URL" --json state --jq .state)
                  if [ "$pr_state" != OPEN ]; then
                    echo "::notice::PR is $pr_state (superseded); nothing to merge."
                    exit 0
                  fi
                  exit 1
                fi
                exit 0 ;;
              missing|pending) sleep 30 ;;
              *)
                echo "::notice::$CHECK finished as '$state'; leaving the PR for review."
                exit 0 ;;
            esac
          done
          echo "::error::$CHECK did not finish within the polling window"
          exit 1
